name: Export reconstructed ScreenSpan source

on:
  workflow_dispatch:
  push:
    branches:
      - agent/screenspan-easy-updates
    paths:
      - '.github/workflows/export-reconstructed-source.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/export-reconstructed-source.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          cat source/ScreenSpan-source-v0.1.0.zip.b64.part-* \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/ScreenSpan-source-v0.1.0.zip
          echo 'f7a928bc66e1482367fbcb8fa160ae711f08a83b1a8530d8c5ee7669c5501c85  /tmp/ScreenSpan-source-v0.1.0.zip' | sha256sum --check
          mkdir -p /tmp/screenspan-v0.2
          unzip -q /tmp/ScreenSpan-source-v0.1.0.zip -d /tmp/screenspan-v0.2
          cat source-v0.2/fixed/chunk-*.b64 \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/ScreenSpan-v0.2-overlay.tar.gz
          echo 'c79ca9dcd81cfecdce89adb87ce0ead0bf04a4cb164f08c6fd1bd5e983a2ac37  /tmp/ScreenSpan-v0.2-overlay.tar.gz' | sha256sum --check
          tar -xzf /tmp/ScreenSpan-v0.2-overlay.tar.gz -C /tmp/screenspan-v0.2/screenspan
          for patch_file in "$GITHUB_WORKSPACE"/patches-v0.2/*.patch; do
            [ -e "$patch_file" ] || continue
            patch -d /tmp/screenspan-v0.2/screenspan -p1 --forward < "$patch_file"
          done
          cd /tmp/screenspan-v0.2
          zip -qr "$GITHUB_WORKSPACE/ScreenSpan-v0.2-reconstructed-source.zip" screenspan
          sha256sum "$GITHUB_WORKSPACE/ScreenSpan-v0.2-reconstructed-source.zip" > "$GITHUB_WORKSPACE/ScreenSpan-v0.2-reconstructed-source.zip.sha256"

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSpan-v0.2-reconstructed-source
          path: |
            ScreenSpan-v0.2-reconstructed-source.zip
            ScreenSpan-v0.2-reconstructed-source.zip.sha256
          if-no-files-found: error
          retention-days: 2
