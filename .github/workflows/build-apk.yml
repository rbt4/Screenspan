name: Build ScreenSpan APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'agent/**'
    paths:
      - 'source/**'
      - 'patches/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'source/**'
      - 'patches/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct and patch source
        shell: bash
        run: |
          set -euo pipefail
          cat source/ScreenSpan-source-v0.1.0.zip.b64.part-* \
            | tr -d '\r\n' \
            | base64 --decode > /tmp/ScreenSpan-source-v0.1.0.zip
          echo 'f7a928bc66e1482367fbcb8fa160ae711f08a83b1a8530d8c5ee7669c5501c85  /tmp/ScreenSpan-source-v0.1.0.zip' | sha256sum --check
          mkdir -p /tmp/screenspan-source
          unzip -q /tmp/ScreenSpan-source-v0.1.0.zip -d /tmp/screenspan-source
          for patch_file in "$GITHUB_WORKSPACE"/patches/*.patch; do
            [ -e "$patch_file" ] || continue
            patch -d /tmp/screenspan-source/screenspan -p1 --forward < "$patch_file"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Test and build signed release APK
        working-directory: /tmp/screenspan-source/screenspan
        shell: bash
        run: |
          set -euo pipefail
          gradle test :app:assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/ScreenSpan-v0.1.0-test.apk"
          sha256sum "$GITHUB_WORKSPACE/ScreenSpan-v0.1.0-test.apk" | tee "$GITHUB_WORKSPACE/ScreenSpan-v0.1.0-test.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScreenSpan-v0.1.0-test
          path: |
            ScreenSpan-v0.1.0-test.apk
            ScreenSpan-v0.1.0-test.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable test download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v0.1.0-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.1.0-test \
              ScreenSpan-v0.1.0-test.apk \
              ScreenSpan-v0.1.0-test.apk.sha256 \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create v0.1.0-test \
              ScreenSpan-v0.1.0-test.apk \
              ScreenSpan-v0.1.0-test.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title 'ScreenSpan v0.1.0 Test' \
              --notes 'First Chromecast with Google TV prototype. Disable projector auto-keystone before calibration. Use only media you are authorized to access.' \
              --prerelease \
              --repo "$GITHUB_REPOSITORY"
          fi
